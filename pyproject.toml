[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-eval"
version = "0.2.0"
description = "Digital Twin evaluation, generative augmentation, and VLA benchmarking for bimanual ALOHA manipulation."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
